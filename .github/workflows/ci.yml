name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy generate.py tests brand

      - name: Test
        run: uv run pytest -q

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      # The tests hold every sound in memory; this proves the whole pack also
      # writes to disk, which is what people actually download.
      - name: Render the pack
        run: uv run generate.py

      - name: Check the manifest covers every file
        run: |
          uv run python -c "
          from pathlib import Path
          wavs = {str(p.relative_to('pack')) for p in Path('pack').rglob('*.wav')}
          wavs.discard('demo_reel.wav')
          recipes = Path('pack/RECIPES.txt').read_text()
          missing = [w for w in sorted(wavs) if w not in recipes]
          assert not missing, f'{len(missing)} files absent from RECIPES.txt: {missing[:5]}'
          print(f'{len(wavs)} sounds rendered, all present in RECIPES.txt')
          "
